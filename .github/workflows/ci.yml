name: CI

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Composer validate
        run: composer validate --strict
      - name: JS syntax check
        run: |
          node --check assets/build/chat.js
          node --check assets/build/admin.js
          node --check tests/Integration/playground-smoke.mjs
      - name: Git diff whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
            git show --check --format= "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Agent guard self-test
        run: bash tests/Scripts/agent-change-guard-test.sh

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install test runtime
        run: npm ci
      - name: Install production PHP runtime
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - name: WordPress core smoke test
        run: npm run test:integration
      - name: Elementor widget smoke test
        run: npm run test:elementor

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: WordPress Coding Standards
        run: composer lint

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: composer test:unit

  quality-gate:
    if: ${{ !cancelled() }}
    needs:
      - preflight
      - php-lint
      - integration
      - coding-standards
      - unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PHP_LINT_RESULT: ${{ needs.php-lint.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          CODING_STANDARDS_RESULT: ${{ needs.coding-standards.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$PHP_LINT_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$CODING_STANDARDS_RESULT" = "success"
          test "$UNIT_TESTS_RESULT" = "success"

  package:
    needs:
      - quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Build and validate installable ZIP
        run: bash scripts/build-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wp-ds-aichatbot-${{ github.sha }}
          path: dist/wp-ds-aichatbot.zip
          if-no-files-found: error
          retention-days: 14
